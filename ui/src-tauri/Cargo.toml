[package]
name = "verio"
version.workspace = true
edition.workspace = true
description = "Verio control-panel app: thin Tauri commands/events bridge onto verio-app"

[lib]
name = "verio_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { workspace = true }
# The same fix as the `indexmap` entry under [dependencies], and it has to be
# repeated here: schemars reaches indexmap 1.9.3 through `tauri-build`, which is a
# *build*-dependency, and cargo resolves build-dependency features in a separate
# set from normal ones. Enabling `std` in only one of the two graphs leaves the
# other probing — and this environment's probe fails.
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
verio-app = { path = "../../crates/verio-app" }
verio-audio = { path = "../../crates/verio-audio" }
verio-discovery = { path = "../../crates/verio-discovery" }
verio-transport = { path = "../../crates/verio-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true, features = [] }
tauri-plugin-global-shortcut = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rfd = { workspace = true }
# Not used by this crate directly. It is here to turn on indexmap's `std` feature,
# which nothing else in the graph does.
#
# indexmap 1.9.3 declares no default features, so `std` is off unless somebody asks
# for it — and `schemars 0.8.22` (pulled in through tauri-utils) depends on it as
# `features = ["serde-1"]` only. With `std` off, indexmap's build script *probes*
# for std using autocfg, and when that probe fails it selects the no-std variant,
# which has no default for its `S` parameter. schemars then fails to compile:
#
#   schemars-0.8.22/src/lib.rs:12:32: error[E0107]:
#     struct takes 3 generic arguments but 2 were supplied
#     pub type Map<K, V> = indexmap::IndexMap<K, V>;
#
# Asking for `std` here takes indexmap's documented fast path instead — the build
# script sees `CARGO_FEATURE_STD` and emits `has_std` without probing — so the
# build no longer depends on a compile-time probe of the toolchain. This is not a
# claim that std is missing: this is a Windows/msvc target that links std fine.
indexmap = { version = "1.9", features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
